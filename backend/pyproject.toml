[project]
name = "como-votou-backend"
version = "0.1.0"
description = "ETL prototype: Câmara Municipal do Rio de Janeiro -> normalized JSON snapshot"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "como-votou-backend"
version = "0.1.0"
description = "ETL prototype: Câmara Municipal do Rio de Janeiro -> normalized JSON snapshot"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "flake8>=7", "mypy>=1.11", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
